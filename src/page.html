<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="A bilingual collection of interactive airsoft setup and physics tools.">
  <title>Airsoft Tools</title>
  <style>
    :root {
      --bg: #090d10;
      --panel: #10171c;
      --panel-2: #151e24;
      --line: #28343c;
      --line-bright: #42515a;
      --text: #edf3f4;
      --muted: #91a0a7;
      --cyan: #5de4e7;
      --cyan-dim: #173b40;
      --amber: #ffbf69;
      --amber-dim: #4b3520;
      --red: #ff756f;
      --green: #6ee7a8;
      --blue: #79a9ff;
      --purple: #b9a0ff;
      --radius: 14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 18% 0%, rgba(93, 228, 231, .08), transparent 27rem),
        var(--bg);
      color: var(--text);
    }

    button, input, select { font: inherit; }
    button { color: inherit; }

    .tool-hub {
      width: min(1180px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 52px;
    }

    .hub-shell {
      display: flex;
      min-height: calc(100vh - 80px);
      flex-direction: column;
    }

    .hub-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .hub-brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .hub-brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(93, 228, 231, .35);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(93, 228, 231, .16), rgba(121, 169, 255, .04));
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      box-shadow: inset 0 1px rgba(255, 255, 255, .06), 0 12px 35px rgba(0, 0, 0, .2);
    }

    .hub-content {
      display: grid;
      flex: 1;
      align-content: center;
      padding: clamp(64px, 12vh, 140px) 0 clamp(52px, 10vh, 110px);
    }

    .hub-intro { max-width: 720px; }
    .hub-intro h1 { font-size: clamp(40px, 7vw, 76px); }
    .hub-intro p:last-child {
      max-width: 610px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .hub-count {
      margin: 54px 0 14px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: minmax(0, 760px);
    }

    .tool-card {
      position: relative;
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) auto;
      gap: 22px;
      align-items: center;
      min-height: 190px;
      padding: 28px;
      overflow: hidden;
      border: 1px solid var(--line-bright);
      border-radius: 20px;
      background:
        linear-gradient(115deg, rgba(93, 228, 231, .085), transparent 43%),
        rgba(16, 23, 28, .92);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .25);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .tool-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .025), transparent);
      transform: translateX(-100%);
      transition: transform .45s ease;
    }

    .tool-card:hover {
      transform: translateY(-3px);
      border-color: rgba(93, 228, 231, .62);
      box-shadow: 0 35px 90px rgba(0, 0, 0, .32), 0 0 0 1px rgba(93, 228, 231, .06);
    }
    .tool-card:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
    .tool-card:hover::after { transform: translateX(100%); }

    .tool-icon {
      display: grid;
      width: 76px;
      height: 76px;
      place-items: center;
      border: 1px solid rgba(93, 228, 231, .3);
      border-radius: 18px;
      background: rgba(8, 16, 20, .7);
      color: var(--cyan);
    }

    .tool-icon svg { width: 42px; height: 42px; }
    .tool-copy { min-width: 0; }
    .tool-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      color: var(--green);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .tool-status::before {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 14px currentColor;
      content: "";
    }
    .tool-copy h2 { font-size: clamp(21px, 3vw, 28px); }
    .tool-copy p {
      max-width: 590px;
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }
    .tool-arrow {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid var(--line-bright);
      border-radius: 999px;
      color: var(--cyan);
      font-size: 24px;
      transition: background .2s ease, transform .2s ease;
    }
    .tool-card:hover .tool-arrow { background: var(--cyan-dim); transform: translateX(3px); }

    .hub-footnote {
      margin: 16px 0 0;
      color: #708087;
      font-size: 13px;
      line-height: 1.5;
    }

    .header-actions { display: flex; align-items: center; gap: 9px; }
    .menu-button {
      min-height: 40px;
      padding: 0 13px;
      border: 1px solid var(--line-bright);
      border-radius: 9px;
      background: #0c1216;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .menu-button:hover { border-color: var(--cyan); color: var(--cyan); }

    .app {
      width: min(1500px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 72px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 780px;
      font-size: clamp(27px, 4vw, 46px);
      line-height: 1.02;
      letter-spacing: -.04em;
    }

    .lede {
      max-width: 730px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .header-note {
      width: min(390px, 100%);
      padding: 12px 14px;
      border: 1px solid var(--amber-dim);
      border-left: 3px solid var(--amber);
      background: rgba(255, 191, 105, .06);
      color: #dbc8ac;
      font-size: 12px;
      line-height: 1.5;
    }

    .header-side {
      display: grid;
      justify-items: end;
      gap: 9px;
      width: min(390px, 100%);
    }

    .language-switch {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line-bright);
      border-radius: 9px;
      background: #0c1216;
    }

    .language-switch button {
      min-width: 86px;
      min-height: 32px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .language-switch button[aria-pressed="true"] {
      background: var(--cyan-dim);
      color: var(--cyan);
    }

    .layout {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(16, 23, 28, .92);
      box-shadow: 0 16px 45px rgba(0, 0, 0, .18);
    }

    .controls-panel {
      position: sticky;
      top: 14px;
      padding: 18px;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    h2, h3, p { margin-top: 0; }
    h2 { margin-bottom: 0; font-size: 18px; letter-spacing: -.015em; }
    h3 { margin-bottom: 12px; font-size: 14px; }

    .control-group {
      padding: 15px 0;
      border-top: 1px solid var(--line);
    }

    .control-group:first-of-type { border-top: 0; padding-top: 3px; }

    .group-label {
      margin: 0 0 12px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .control { margin-top: 15px; }
    .control:first-child { margin-top: 0; }

    .preset-note {
      min-height: 44px;
      margin: 9px 0 0;
      padding: 9px 10px;
      border-left: 2px solid var(--purple);
      background: rgba(185, 160, 255, .045);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .spring-note {
      min-height: 0;
      border-left-color: var(--amber);
      background: rgba(255, 191, 105, .045);
    }

    .control-explainer {
      margin: 8px 0 0;
      padding: 10px 11px;
      border-left: 2px solid var(--amber);
      border-radius: 0 7px 7px 0;
      background: rgba(255, 191, 105, .06);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .control-explainer strong { color: var(--amber); }

    .control-live-note {
      display: block;
      margin-top: 7px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 10px;
    }

    .control label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      font-size: 13px;
    }

    output, .mono { font-family: var(--mono); }
    output { color: var(--text); font-size: 12px; }

    input[type="range"] {
      width: 100%;
      height: 18px;
      margin: 0;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    select, input[type="number"] {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line-bright);
      border-radius: 8px;
      outline: none;
      background: #0c1216;
      color: var(--text);
      padding: 8px 10px;
    }

    select:focus, input:focus-visible, button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .preset-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .preset {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #0c1216;
      color: var(--muted);
      cursor: pointer;
    }

    .preset[aria-pressed="true"] {
      border-color: var(--cyan);
      background: var(--cyan-dim);
      color: var(--cyan);
    }

    .mass-entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 82px;
      gap: 8px;
      align-items: center;
      margin-bottom: 9px;
    }

    .mass-entry input[type="number"] { min-height: 36px; padding: 6px 8px; }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 21px;
      padding: 2px 7px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .06em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tag.geometry { color: var(--green); }
    .tag.model { color: var(--blue); }
    .tag.heuristic { color: var(--amber); }
    .tag.unknown { color: var(--purple); border-style: dashed; }

    details {
      border-top: 1px solid var(--line);
      padding-top: 13px;
    }

    summary {
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .assumption-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 10px;
      margin-top: 12px;
      font-size: 11px;
      line-height: 1.35;
    }

    .assumption-grid span:nth-child(odd) { color: var(--muted); }

    .advanced-controls { margin-top: 13px; }
    .advanced-controls[open] > summary { color: var(--cyan); }
    .advanced-section { padding: 13px 0 2px; border-top: 1px solid rgba(66, 81, 90, .65); }
    .advanced-section:first-of-type { border-top: 0; }
    .advanced-section .group-label { margin-bottom: 8px; color: var(--text); }
    .advanced-help { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .advanced-reset { width: 100%; margin: 11px 0 2px; }

    .main { min-width: 0; }

    .readout-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .readout {
      min-height: 100px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
    }

    .readout .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 7px;
      min-height: 27px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .readout strong {
      display: block;
      margin-top: 7px;
      font-family: var(--mono);
      font-size: clamp(17px, 2vw, 23px);
      font-weight: 650;
      letter-spacing: -.04em;
    }

    .readout small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
    }

    .timing-card {
      margin-bottom: 10px;
      padding: 15px;
    }

    .timing-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 11px;
    }

    .timing-head strong { font-size: 13px; }

    #goalVerdict {
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      text-align: right;
    }

    .timing-track {
      position: relative;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #0b1115;
      overflow: hidden;
    }

    .timing-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: linear-gradient(90deg, rgba(93,228,231,.11), rgba(93,228,231,.25));
    }

    .timing-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--text);
    }

    .timing-marker::after {
      content: attr(data-label);
      position: absolute;
      top: 7px;
      left: 6px;
      width: max-content;
      color: var(--text);
      font-family: var(--mono);
      font-size: 9px;
      white-space: nowrap;
    }

    .timing-marker.brake { background: var(--amber); }
    .timing-marker.brake::after { color: var(--amber); }
    .timing-marker.exit { background: var(--cyan); }
    .timing-marker.exit::after { color: var(--cyan); transform: translateX(-100%); left: -5px; }

    .factor-impact { margin-bottom: 10px; padding: 14px 15px; }
    .factor-impact .panel-heading { margin-bottom: 10px; }
    .factor-summary { margin: 0 0 11px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .factor-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; }
    .factor-delta { padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: #0b1115; }
    .factor-delta span { display: block; color: var(--muted); font-size: 10px; line-height: 1.3; }
    .factor-delta strong { display: block; margin-top: 4px; font-family: var(--mono); font-size: 13px; }
    .factor-delta strong.changed { color: var(--cyan); }

    .stage {
      position: relative;
      overflow: hidden;
    }

    .stage-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .primary-button, .secondary-button, .danger-button {
      min-height: 38px;
      border-radius: 8px;
      padding: 0 14px;
      cursor: pointer;
    }

    .primary-button {
      border: 1px solid #79f3f5;
      background: var(--cyan);
      color: #061012;
      font-weight: 800;
    }

    .secondary-button {
      border: 1px solid var(--line-bright);
      background: #11191e;
      color: var(--text);
    }

    .danger-button {
      border: 1px solid #743b3b;
      background: transparent;
      color: #ffaaa6;
    }

    .stage-toolbar input[type="range"] { flex: 1; min-width: 80px; }
    .clock { min-width: 80px; color: var(--muted); font-size: 11px; text-align: right; }

    .stage-viewport {
      position: relative;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
        #0b1115;
      background-size: 30px 30px;
    }

    #mechanism {
      display: block;
      width: 100%;
      height: auto;
      min-height: 250px;
    }

    .stage-status {
      position: absolute;
      left: 16px;
      bottom: 14px;
      max-width: calc(100% - 32px);
      padding: 8px 11px;
      border: 1px solid rgba(93, 228, 231, .34);
      border-radius: 7px;
      background: rgba(4, 11, 14, .88);
      backdrop-filter: blur(8px);
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 11px;
    }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 11px 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
    }

    .legend-row span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .live-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid var(--line);
    }

    .live-item {
      padding: 10px 12px;
      border-right: 1px solid var(--line);
    }

    .live-item:last-child { border-right: 0; }
    .live-item span { display: block; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .06em; }
    .live-item strong { display: block; margin-top: 4px; font-family: var(--mono); font-size: 13px; }

    .graphs {
      margin-top: 18px;
      padding: 16px;
    }

    .graphs-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 11px;
    }

    .graphs-header p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }

    .graphs-mechanism {
      margin-bottom: 16px;
      overflow: hidden;
      border: 1px solid #314650;
      border-radius: 10px;
      background: radial-gradient(ellipse at 25% 35%,rgba(255,191,105,.045),transparent 65%),radial-gradient(ellipse at 85% 40%,rgba(93,228,231,.055),transparent 60%),#0b141b;
    }

    .graphs-mechanism-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
    }

    .graphs-mechanism-heading strong { font-size: .875rem; }
    .graphs-mechanism-heading span { color: var(--cyan); font: .75rem var(--mono); }
    #mechanismGraph {
      display: block;
      width: 100%;
      height: clamp(220px, 28vh, 300px);
      min-height: 0;
      background: linear-gradient(180deg,rgba(7,16,23,.15),rgba(7,16,23,.65));
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 11px;
    }

    .chart {
      position: relative;
      min-width: 0;
    }

    .chart-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 0 4px 6px;
      color: var(--muted);
      font-size: 10px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 190px;
      border: 1px solid var(--line);
      background: #0a1014;
    }

    .intensity-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .sound-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-top: 18px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 191, 105, .24);
      border-radius: 10px;
      background: rgba(255, 191, 105, .045);
    }

    .sound-heading strong { display: block; color: var(--amber); font-size: 13px; }
    .sound-heading p { max-width: 820px; margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }

    .intensity {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
