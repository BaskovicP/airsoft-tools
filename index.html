<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="A bilingual collection of interactive airsoft setup and physics tools.">
  <title>Airsoft Tools</title>
  <style>
    :root {
      --bg: #090d10;
      --panel: #10171c;
      --panel-2: #151e24;
      --line: #28343c;
      --line-bright: #42515a;
      --text: #edf3f4;
      --muted: #91a0a7;
      --cyan: #5de4e7;
      --cyan-dim: #173b40;
      --amber: #ffbf69;
      --amber-dim: #4b3520;
      --red: #ff756f;
      --green: #6ee7a8;
      --blue: #79a9ff;
      --purple: #b9a0ff;
      --radius: 14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 18% 0%, rgba(93, 228, 231, .08), transparent 27rem),
        var(--bg);
      color: var(--text);
    }

    button, input, select { font: inherit; }
    button { color: inherit; }

    .tool-hub {
      width: min(1180px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 52px;
    }

    .hub-shell {
      display: flex;
      min-height: calc(100vh - 80px);
      flex-direction: column;
    }

    .hub-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .hub-brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .hub-brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(93, 228, 231, .35);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(93, 228, 231, .16), rgba(121, 169, 255, .04));
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      box-shadow: inset 0 1px rgba(255, 255, 255, .06), 0 12px 35px rgba(0, 0, 0, .2);
    }

    .hub-content {
      display: grid;
      flex: 1;
      align-content: center;
      padding: clamp(64px, 12vh, 140px) 0 clamp(52px, 10vh, 110px);
    }

    .hub-intro { max-width: 720px; }
    .hub-intro h1 { font-size: clamp(40px, 7vw, 76px); }
    .hub-intro p:last-child {
      max-width: 610px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .hub-count {
      margin: 54px 0 14px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: minmax(0, 760px);
    }

    .tool-card {
      position: relative;
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) auto;
      gap: 22px;
      align-items: center;
      min-height: 190px;
      padding: 28px;
      overflow: hidden;
      border: 1px solid var(--line-bright);
      border-radius: 20px;
      background:
        linear-gradient(115deg, rgba(93, 228, 231, .085), transparent 43%),
        rgba(16, 23, 28, .92);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .25);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .tool-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .025), transparent);
      transform: translateX(-100%);
      transition: transform .45s ease;
    }

    .tool-card:hover {
      transform: translateY(-3px);
      border-color: rgba(93, 228, 231, .62);
      box-shadow: 0 35px 90px rgba(0, 0, 0, .32), 0 0 0 1px rgba(93, 228, 231, .06);
    }
    .tool-card:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
    .tool-card:hover::after { transform: translateX(100%); }

    .tool-icon {
      display: grid;
      width: 76px;
      height: 76px;
      place-items: center;
      border: 1px solid rgba(93, 228, 231, .3);
      border-radius: 18px;
      background: rgba(8, 16, 20, .7);
      color: var(--cyan);
    }

    .tool-icon svg { width: 42px; height: 42px; }
    .tool-copy { min-width: 0; }
    .tool-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      color: var(--green);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .tool-status::before {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 14px currentColor;
      content: "";
    }
    .tool-copy h2 { font-size: clamp(21px, 3vw, 28px); }
    .tool-copy p {
      max-width: 590px;
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }
    .tool-arrow {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid var(--line-bright);
      border-radius: 999px;
      color: var(--cyan);
      font-size: 24px;
      transition: background .2s ease, transform .2s ease;
    }
    .tool-card:hover .tool-arrow { background: var(--cyan-dim); transform: translateX(3px); }

    .hub-footnote {
      margin: 16px 0 0;
      color: #708087;
      font-size: 13px;
      line-height: 1.5;
    }

    .header-actions { display: flex; align-items: center; gap: 9px; }
    .menu-button {
      min-height: 40px;
      padding: 0 13px;
      border: 1px solid var(--line-bright);
      border-radius: 9px;
      background: #0c1216;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .menu-button:hover { border-color: var(--cyan); color: var(--cyan); }

    .app {
      width: min(1500px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 72px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 780px;
      font-size: clamp(27px, 4vw, 46px);
      line-height: 1.02;
      letter-spacing: -.04em;
    }

    .lede {
      max-width: 730px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .header-note {
      width: min(390px, 100%);
      padding: 12px 14px;
      border: 1px solid var(--amber-dim);
      border-left: 3px solid var(--amber);
      background: rgba(255, 191, 105, .06);
      color: #dbc8ac;
      font-size: 12px;
      line-height: 1.5;
    }

    .header-side {
      display: grid;
      justify-items: end;
      gap: 9px;
      width: min(390px, 100%);
    }

    .language-switch {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line-bright);
      border-radius: 9px;
      background: #0c1216;
    }

    .language-switch button {
      min-width: 86px;
      min-height: 32px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .language-switch button[aria-pressed="true"] {
      background: var(--cyan-dim);
      color: var(--cyan);
    }

    .layout {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(16, 23, 28, .92);
      box-shadow: 0 16px 45px rgba(0, 0, 0, .18);
    }

    .controls-panel {
      position: sticky;
      top: 14px;
      padding: 18px;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    h2, h3, p { margin-top: 0; }
    h2 { margin-bottom: 0; font-size: 18px; letter-spacing: -.015em; }
    h3 { margin-bottom: 12px; font-size: 14px; }

    .control-group {
      padding: 15px 0;
      border-top: 1px solid var(--line);
    }

    .control-group:first-of-type { border-top: 0; padding-top: 3px; }

    .group-label {
      margin: 0 0 12px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .control { margin-top: 15px; }
    .control:first-child { margin-top: 0; }

    .preset-note {
      min-height: 44px;
      margin: 9px 0 0;
      padding: 9px 10px;
      border-left: 2px solid var(--purple);
      background: rgba(185, 160, 255, .045);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .spring-note {
      min-height: 0;
      border-left-color: var(--amber);
      background: rgba(255, 191, 105, .045);
    }

    .control-explainer {
      margin: 8px 0 0;
      padding: 10px 11px;
      border-left: 2px solid var(--amber);
      border-radius: 0 7px 7px 0;
      background: rgba(255, 191, 105, .06);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .control-explainer strong { color: var(--amber); }

    .control-live-note {
      display: block;
      margin-top: 7px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 10px;
    }

    .control label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      font-size: 13px;
    }

    output, .mono { font-family: var(--mono); }
    output { color: var(--text); font-size: 12px; }

    input[type="range"] {
      width: 100%;
      height: 18px;
      margin: 0;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    select, input[type="number"] {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line-bright);
      border-radius: 8px;
      outline: none;
      background: #0c1216;
      color: var(--text);
      padding: 8px 10px;
    }

    select:focus, input:focus-visible, button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .preset-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .preset {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #0c1216;
      color: var(--muted);
      cursor: pointer;
    }

    .preset[aria-pressed="true"] {
      border-color: var(--cyan);
      background: var(--cyan-dim);
      color: var(--cyan);
    }

    .mass-entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 82px;
      gap: 8px;
      align-items: center;
      margin-bottom: 9px;
    }

    .mass-entry input[type="number"] { min-height: 36px; padding: 6px 8px; }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 21px;
      padding: 2px 7px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .06em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tag.geometry { color: var(--green); }
    .tag.model { color: var(--blue); }
    .tag.heuristic { color: var(--amber); }
    .tag.unknown { color: var(--purple); border-style: dashed; }

    details {
      border-top: 1px solid var(--line);
      padding-top: 13px;
    }

    summary {
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .assumption-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 10px;
      margin-top: 12px;
      font-size: 11px;
      line-height: 1.35;
    }

    .assumption-grid span:nth-child(odd) { color: var(--muted); }

    .advanced-controls { margin-top: 13px; }
    .advanced-controls[open] > summary { color: var(--cyan); }
    .advanced-section { padding: 13px 0 2px; border-top: 1px solid rgba(66, 81, 90, .65); }
    .advanced-section:first-of-type { border-top: 0; }
    .advanced-section .group-label { margin-bottom: 8px; color: var(--text); }
    .advanced-help { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .advanced-reset { width: 100%; margin: 11px 0 2px; }

    .main { min-width: 0; }

    .readout-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .readout {
      min-height: 100px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
    }

    .readout .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 7px;
      min-height: 27px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .readout strong {
      display: block;
      margin-top: 7px;
      font-family: var(--mono);
      font-size: clamp(17px, 2vw, 23px);
      font-weight: 650;
      letter-spacing: -.04em;
    }

    .readout small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
    }

    .timing-card {
      margin-bottom: 10px;
      padding: 15px;
    }

    .timing-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 11px;
    }

    .timing-head strong { font-size: 13px; }

    #goalVerdict {
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      text-align: right;
    }

    .timing-track {
      position: relative;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #0b1115;
      overflow: hidden;
    }

    .timing-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: linear-gradient(90deg, rgba(93,228,231,.11), rgba(93,228,231,.25));
    }

    .timing-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--text);
    }

    .timing-marker::after {
      content: attr(data-label);
      position: absolute;
      top: 7px;
      left: 6px;
      width: max-content;
      color: var(--text);
      font-family: var(--mono);
      font-size: 9px;
      white-space: nowrap;
    }

    .timing-marker.brake { background: var(--amber); }
    .timing-marker.brake::after { color: var(--amber); }
    .timing-marker.exit { background: var(--cyan); }
    .timing-marker.exit::after { color: var(--cyan); transform: translateX(-100%); left: -5px; }

    .factor-impact { margin-bottom: 10px; padding: 14px 15px; }
    .factor-impact .panel-heading { margin-bottom: 10px; }
    .factor-summary { margin: 0 0 11px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .factor-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; }
    .factor-delta { padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: #0b1115; }
    .factor-delta span { display: block; color: var(--muted); font-size: 10px; line-height: 1.3; }
    .factor-delta strong { display: block; margin-top: 4px; font-family: var(--mono); font-size: 13px; }
    .factor-delta strong.changed { color: var(--cyan); }

    .stage {
      position: relative;
      overflow: hidden;
    }

    .stage-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .primary-button, .secondary-button, .danger-button {
      min-height: 38px;
      border-radius: 8px;
      padding: 0 14px;
      cursor: pointer;
    }

    .primary-button {
      border: 1px solid #79f3f5;
      background: var(--cyan);
      color: #061012;
      font-weight: 800;
    }

    .secondary-button {
      border: 1px solid var(--line-bright);
      background: #11191e;
      color: var(--text);
    }

    .danger-button {
      border: 1px solid #743b3b;
      background: transparent;
      color: #ffaaa6;
    }

    .stage-toolbar input[type="range"] { flex: 1; min-width: 80px; }
    .clock { min-width: 80px; color: var(--muted); font-size: 11px; text-align: right; }

    .stage-viewport {
      position: relative;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
        #0b1115;
      background-size: 30px 30px;
    }

    #mechanism {
      display: block;
      width: 100%;
      height: auto;
      min-height: 250px;
    }

    .stage-status {
      position: absolute;
      left: 16px;
      bottom: 14px;
      max-width: calc(100% - 32px);
      padding: 8px 11px;
      border: 1px solid rgba(93, 228, 231, .34);
      border-radius: 7px;
      background: rgba(4, 11, 14, .88);
      backdrop-filter: blur(8px);
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 11px;
    }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 11px 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
    }

    .legend-row span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .live-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid var(--line);
    }

    .live-item {
      padding: 10px 12px;
      border-right: 1px solid var(--line);
    }

    .live-item:last-child { border-right: 0; }
    .live-item span { display: block; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .06em; }
    .live-item strong { display: block; margin-top: 4px; font-family: var(--mono); font-size: 13px; }

    .graphs {
      margin-top: 18px;
      padding: 16px;
    }

    .graphs-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 11px;
    }

    .graphs-header p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 11px;
    }

    .chart {
      position: relative;
      min-width: 0;
    }

    .chart-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 0 4px 6px;
      color: var(--muted);
      font-size: 10px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 190px;
      border: 1px solid var(--line);
      background: #0a1014;
    }

    .intensity-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .sound-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-top: 18px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 191, 105, .24);
      border-radius: 10px;
      background: rgba(255, 191, 105, .045);
    }

    .sound-heading strong { display: block; color: var(--amber); font-size: 13px; }
    .sound-heading p { max-width: 820px; margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }

    .intensity {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .intensity.impact-primary {
      --impact-color: var(--amber);
      border-color: color-mix(in srgb, var(--impact-color) 58%, var(--line));
      border-left: 4px solid var(--impact-color);
      background: linear-gradient(135deg, color-mix(in srgb, var(--impact-color) 9%, var(--panel)), var(--panel) 70%);
      box-shadow: inset 0 0 28px color-mix(in srgb, var(--impact-color) 5%, transparent);
      transition: border-color .2s, background .2s, box-shadow .2s;
    }

    .intensity.impact-primary[data-severity="very-soft"] { --impact-color: var(--green); }
    .intensity.impact-primary[data-severity="soft"] { --impact-color: var(--cyan); }
    .intensity.impact-primary[data-severity="moderate"] { --impact-color: var(--amber); }
    .intensity.impact-primary[data-severity="hard"],
    .intensity.impact-primary[data-severity="very-hard"] { --impact-color: var(--red); }

    .intensity-head {
      display: flex;
      align-items: center;

      <div class="layout"><aside class="panel controls-panel ${window.innerWidth <= 760 ? "is-collapsed" : ""}" aria-label="${t("Simulation controls", "Kontrole simulacije")}"><div class="panel-heading"><h2>${t("Setup", "Postavke")}</h2><button class="secondary-button" id="toggleControls" type="button" aria-expanded="${window.innerWidth > 760}">${t("Show / hide", "Prikaži / sakrij")}</button></div>

  function calibrationMarkup() {
    return `<details class="panel calibration" id="calibrationPanel"><summary>${t("Calibration · actual chrono measurements", "Kalibracija · stvarna mjerenja kronografom")}</summary><div class="calibration-body"><p class="calibration-intro">${t("Your 0.46 g / 330 fps observation is a reference until its full setup is recorded. Energy is derived from mass and velocity, not an independent measurement. Record each shot. All data stays in this browser unless you export it.", "Mjerenje 0,46 g / 330 fps ostaje referenca dok se ne zabilježi potpuna konfiguracija. Energija se izvodi iz mase i brzine, nije neovisno mjerenje. Zabilježite svaki hitac. Podaci ostaju u ovom pregledniku osim ako ih izvezete.")}</p>

      <label>${t("Use this shot as", "Namjena hica")}<select id="measurementRole"><option value="reference">${t("Reference only", "Samo referenca")}</option><option value="train">${t("Training / fit", "Podatak za prilagodbu")}</option><option value="validation">${t("Held-out validation", "Neovisna provjera")}</option></select></label><label class="wide">${t("Notes: pin, spring, hop setting, BB batch, chrono distance, temperature", "Bilješke: pin, opruga, hop, serija BB-a, udaljenost kronografa, temperatura")}<input id="measurementNotes" type="text" maxlength="2000"></label><label class="wide provenance"><input id="measurementConfirm" type="checkbox">${t("The current inputs describe the hardware used for this measured shot", "Trenutačni ulazi opisuju sklop kojim je ovaj hitac izmjeren")}</label><output id="measurementEnergy" class="wide small-note"></output><button type="submit" class="secondary-button">${t("Add shot", "Dodaj hitac")}</button></form>
      <p class="small-note">${t("Fitting is enabled only for confirmed setups with measured geometry/masses and spring data. It fits one shared head discharge coefficient (Cd), never spring strength and airflow together. Repeating one setup does not identify more parameters. Held-out shots are excluded from fitting.", "Prilagodba je omogućena samo za potvrđene konfiguracije s izmjerenom geometrijom/masama i podacima opruge. Prilagođava se jedan zajednički koeficijent protoka glave (Cd), nikad zajedno snaga opruge i protok. Ponavljanje iste konfiguracije ne određuje više parametara. Hici za neovisnu provjeru ne koriste se pri prilagodbi.")}</p>
      <div class="table-wrap"><table><thead><tr><th>BB</th><th>fps / J</th><th>${t("Use / setup", "Namjena / konfiguracija")}</th><th>${t("Notes", "Bilješke")}</th><th></th></tr></thead><tbody id="measurementRows"></tbody></table></div>

      </div></details>`;

  function ensureOptimizer() {
    if (optimizer) return;
    optimizer = { locks: Object.fromEntries(Object.keys(O.GROUPS).map(key => [key, !["piston", "airbrake"].includes(key)])),
      values: Object.fromEntries(Object.keys(O.LIMITS).map(key => [key, String(p[key])])), priority: "balanced", budget: 120,
      result: null, open: false, cancelled: false, running: false, status: null };
    optimizer.values.pistonMass = [...new Set([p.pistonMass, 58, 65, 68, 72, 76, 82])].join(", ");
    optimizer.values.airbrakeLength = [...new Set([p.airbrakeLength, 0, p.airbrakeLength - 2, p.airbrakeLength - 1, p.airbrakeLength + 1, p.airbrakeLength + 2].filter(v => v >= 0 && v <= 40).map(v => Number(v.toFixed(3))))].join(", ");
  }
  function optimizerMarkup() {
    ensureOptimizer();
    const labels = { cylinder: ["Cylinder", "Cilindar"], barrel: ["Barrel", "Cijev"], head: ["Head / nozzle", "Glava / mlaznica"], piston: ["Piston", "Piston"], airbrake: ["Airbrake", "Zračna kočnica"], spring: ["Spring", "Opruga"], bb: ["BB", "BB"] };
    return `<section class="panel optimizer"><div class="optimizer-heading"><div><h2>${t("Find a quieter, efficient setup", "Pronađi tišu i učinkovitiju konfiguraciju")}</h2><p class="small-note">${t("Freeze the parts you want to keep. Search only the hardware choices you can change.", "Zamrznite dijelove koje želite zadržati. Pretražujte samo zamjenjive dijelove.")}</p></div><button class="primary-button" type="button" id="toggleOptimizer" aria-expanded="${optimizer.open}" aria-controls="optimizerBody">${t("Freeze parts & optimize", "Zamrzni dijelove i optimiziraj")}</button></div>
      <div id="optimizerBody" ${optimizer.open ? "" : "hidden"}><p class="optimizer-target">${t("Performance constraint: keep 95–105% of this setup’s predicted BB exit energy.", "Uvjet performansi: zadrži 95–105% predviđene izlazne energije BB-a trenutačne konfiguracije.")}</p>
      <p class="small-note">${t("Checked = frozen. Enter actual available choices separated by commas; use a dot for decimals. The current value is always included. Example piston masses and pin lengths are hypothetical—not verified compatible AMP parts. Changing geometry can require new sealing/friction measurements.", "Označeno = zamrznuto. Unesite stvarno dostupne vrijednosti odvojene zarezima; decimalni znak je točka. Trenutačna vrijednost uvijek je uključena. Primjeri masa pistona i duljina pina hipotetski su — nisu potvrđeni kompatibilni AMP dijelovi. Promjena geometrije može zahtijevati novo mjerenje brtvljenja i trenja.")}</p>
      <div class="optimizer-locks">${Object.entries(O.GROUPS).map(([group, keys]) => `<fieldset class="optimizer-part"><legend><label><input type="checkbox" data-opt-lock="${group}" ${optimizer.locks[group] ? "checked" : ""}>${t("Freeze", "Zamrzni")} ${t(...labels[group])}</label></legend><details ${!optimizer.locks[group] ? "open" : ""}><summary>${t("Candidate values", "Vrijednosti kandidata")}</summary>${keys.map(key => {
        const fixedSpring = O.fixedReason(p, key);
        return `<label class="optimizer-field" for="opt-${key}"><span>${t(fields[key][0], fields[key][1])} (${fields[key][2] === "turns" ? t("turns", "zavoja") : fields[key][2]})</span><input type="text" id="opt-${key}" data-opt-values="${key}" value="${esc(fixedSpring ? String(p[key]) : optimizer.values[key])}" ${optimizer.locks[group] || fixedSpring ? "disabled" : ""} maxlength="180"><small ${fixedSpring ? "" : "hidden"}>${t("Fixed by the spring input mode or measured curve. Enable length mode in Setup to search spring lengths.", "Fiksno zbog načina unosa opruge ili izmjerene krivulje. Za pretragu duljina uključite taj način u Postavkama.")}</small></label>`;
      }).join("")}</details></fieldset>`).join("")}</div>
      <div class="optimizer-options"><label>${t("Ranking preference", "Prioritet rangiranja")}<select id="optimizerPriority">${[["balanced", "Balanced trade-off", "Uravnotežen kompromis"], ["quiet", "Lower sound contributors", "Niži doprinosi zvuku"], ["efficient", "Higher energy efficiency", "Viša energetska učinkovitost"]].map(([value, en, hr]) => `<option value="${value}" ${optimizer.priority === value ? "selected" : ""}>${t(en, hr)}</option>`).join("")}</select></label><label>${t("Maximum combinations", "Najviše kombinacija")}<select id="optimizerBudget">${[60, 120, 240].map(v => `<option ${optimizer.budget === v ? "selected" : ""}>${v}</option>`).join("")}</select></label></div>
      <p class="small-note">${t("Weather, fitted airflow/leakage, friction, damping and timing criteria stay fixed. Every candidate uses the same 250 ms observation limit, allowing delayed contact/discharge. Efficiency = BB exit energy ÷ initial available spring work. Rankings compare impact energy, peak muzzle airflow, exit pressure and efficiency—not dB or guaranteed loudness.", "Vrijeme, prilagođeni protok/curenje, trenje, prigušenje i vremenski kriteriji ostaju fiksni. Svaki kandidat koristi isti prozor promatranja od 250 ms za kasni kontakt/pražnjenje. Učinkovitost = izlazna energija BB-a ÷ početni raspoloživi rad opruge. Rangiranje uspoređuje energiju udara, vršni protok, izlazni tlak i učinkovitost — ne dB ni zajamčenu glasnoću.")}</p>
      <details><summary>${t("How ranking works", "Kako radi rangiranje")}</summary><p class="small-note">${t("Only completed, numerically acceptable shots inside the energy band qualify. Keep the non-dominated trade-offs: no other tested candidate is at least as good on all four objectives and better on one. Rank those with range-normalized weighted costs. Impact / airflow / exit pressure / inefficiency weights: balanced 35/20/15/30%; sound-biased 45/25/20/10%; efficiency-biased 15/10/5/70%. These weights are preferences, not an acoustic formula. A limited search finds the best tested choices, not a global optimum.", "Prikladni su samo završeni, numerički prihvatljivi hici unutar energetskog raspona. Zadržavaju se nedominirani kompromisi: nijedan drugi ispitani kandidat nije jednako dobar u sva četiri cilja i bolji u jednom. Rangiraju se normaliziranim ponderiranim troškovima. Udar / protok / tlak / neučinkovitost: uravnoteženo 35/20/15/30%; zvuk 45/25/20/10%; učinkovitost 15/10/5/70%. Ponderi su prioriteti, ne akustička formula. Ograničena pretraga pronalazi najbolje ispitane opcije, ne globalni optimum.")}</p></details>
      <div class="fit-row"><button class="primary-button" type="button" id="runOptimizer">${t("Find best combinations", "Pronađi najbolje kombinacije")}</button><button class="secondary-button" type="button" id="cancelOptimizer" disabled>${t("Cancel search", "Prekini pretragu")}</button></div><p class="status-line" role="status" id="optimizerStatus">${optimizer.status ? esc(t(...optimizer.status)) : ""}</p><div id="optimizerResults"></div></div></section>`;
  }
  function invalidateOptimizer() {
    if (!optimizer) return;
    optimizer.cancelled = true;
    if (optimizer.result) optimizer.status = ["Setup or search choices changed. Run the search again before applying a result.", "Konfiguracija ili odabiri pretrage promijenjeni su. Ponovite pretragu prije primjene rezultata."];
    optimizer.result = null;
    if ($("optimizerResults")) $("optimizerResults").innerHTML = "";
    if ($("optimizerStatus")) $("optimizerStatus").textContent = optimizer.status ? t(...optimizer.status) : "";
  }
  function bindOptimizer() {
    $("toggleOptimizer").addEventListener("click", e => { optimizer.open = !optimizer.open; $("optimizerBody").hidden = !optimizer.open; e.currentTarget.setAttribute("aria-expanded", String(optimizer.open)); });
    document.querySelectorAll("[data-opt-lock]").forEach(box => box.addEventListener("change", () => {
      const group = box.dataset.optLock; optimizer.locks[group] = box.checked; invalidateOptimizer();
      for (const key of O.GROUPS[group]) $("opt-" + key).disabled = box.checked || Boolean(O.fixedReason(p, key));
      box.closest("fieldset").querySelector("details").open = !box.checked;
    }));
    document.querySelectorAll("[data-opt-values]").forEach(input => input.addEventListener("input", () => { optimizer.values[input.dataset.optValues] = input.value; invalidateOptimizer(); }));
    $("optimizerPriority").addEventListener("change", e => { optimizer.priority = e.target.value; invalidateOptimizer(); });
    $("optimizerBudget").addEventListener("change", e => { optimizer.budget = Number(e.target.value); invalidateOptimizer(); });
    $("cancelOptimizer").addEventListener("click", () => { optimizer.cancelled = true; $("cancelOptimizer").disabled = true; $("optimizerStatus").textContent = t("Cancelling after the current shot…", "Prekid nakon trenutačnog hica…"); });
    $("runOptimizer").addEventListener("click", async () => {
      if (busy) return;
      clearTimeout(debounce); stop();
      if (!shot) recalculate();
      const base = clone(p), config = { locks: clone(optimizer.locks), values: {}, budget: optimizer.budget, priority: optimizer.priority };
      try {
        for (const [group, keys] of Object.entries(O.GROUPS)) if (!config.locks[group]) for (const key of keys) config.values[key] = O.fixedReason(p, key) ? [p[key]] : O.parseValues(optimizer.values[key]);
        O.searchSpace(base, config);
      } catch (_) { optimizer.status = ["Check candidate lists: up to 12 numbers per field, within the normal control ranges. Use decimal dots. Confirm the starting setup is valid.", "Provjerite popise: do 12 brojeva po polju, unutar uobičajenih raspona kontrola. Koristite decimalnu točku. Početna konfiguracija mora biti valjana."]; $("optimizerStatus").textContent = t(...optimizer.status); return; }
      optimizer.cancelled = false; optimizer.running = true; optimizer.result = null;
      $("optimizerResults").innerHTML = ""; setBusy(true); $("cancelOptimizer").disabled = false;
      $("optimizerStatus").textContent = t("Capturing current energy and evaluating hardware combinations…", "Bilježenje trenutačne energije i provjera kombinacija dijelova…");
      await new Promise(resolve => setTimeout(resolve, 20));
      try {
        const result = await O.search(base, config, {
          isCancelled: () => optimizer.cancelled || JSON.stringify(p) !== JSON.stringify(base) || location.hash !== "#pneumatic-timing",
          onProgress: progress => { if ($("optimizerStatus")) $("optimizerStatus").textContent = t(`${progress.completed} / ${progress.planned} combinations checked · ${progress.eligible} eligible.`, `Provjereno ${progress.completed} / ${progress.planned} kombinacija · ${progress.eligible} prikladnih.`); }
        });
        optimizer.result = result; optimizer.status = ["Search complete. Review the trade-offs before applying a hypothetical setup.", "Pretraga je završena. Pregledajte kompromise prije primjene hipotetske konfiguracije."];
      } catch (error) {
        optimizer.result = null;
        optimizer.status = error.message === "optimizer:cancelled" ? ["Search cancelled. No setup was changed and partial results were discarded.", "Pretraga je prekinuta. Konfiguracija nije promijenjena, a djelomični rezultati odbačeni su."] : ["Search cannot start: the current setup needs a valid BB exit to define its energy target. Check inputs or spring data.", "Pretraga nije moguća: trenutačna konfiguracija mora dati valjan izlazak BB-a za ciljni energetski raspon. Provjerite ulaze ili oprugu."];
      } finally {
        optimizer.running = false; setBusy(false);
        if ($("optimizerStatus")) { $("optimizerStatus").textContent = t(...optimizer.status); $("cancelOptimizer").disabled = true; renderOptimizerResults(); }
      }
    });
  }

    ctx.lineWidth = 2; ctx.strokeStyle = "#687881"; ctx.fillStyle = "#10171c";
    ctx.fillRect(wall, 90, head - wall, 110); ctx.strokeRect(wall, 90, head - wall, 110);
    ctx.fillStyle = `rgba(255,191,105,${pressureAlpha(f.cylinderPressure)})`; ctx.fillRect(face, 94, Math.max(0, head - face), 102);
    ctx.fillStyle = "#303c43"; ctx.fillRect(head, 112, 60, 65);
    ctx.fillStyle = "#090d10"; ctx.fillRect(head, 134, 60, 22); ctx.strokeRect(head, 134, 60, 22);
    ctx.strokeRect(barrelStart, 132, end - barrelStart, 26);
    ctx.fillStyle = `rgba(93,228,231,${pressureAlpha(f.pressure)})`; ctx.fillRect(barrelStart, 134, Math.max(0, Math.min(bb, end) - barrelStart), 22);
    ctx.strokeStyle = "#ffbf69"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(wall + 5, 145);
    for (let i = 0; i <= 22; i++) ctx.lineTo(wall + 10 + (face - wall - 47) * i / 22, i === 0 || i === 22 ? 145 : i % 2 ? 122 : 168);
    ctx.stroke(); ctx.fillStyle = "#87969e"; ctx.fillRect(face - 30, 95, 30, 100);
    if (p.airbrakeLength > 0) {
      const length = p.airbrakeLength / p.strokeLength * (head - face0), thick = Math.min(18, p.airbrakeDiameter / p.headBore * 22), tip = Math.min(length, length * p.airbrakeTaper / p.airbrakeLength);
      ctx.fillStyle = "#e4edef"; ctx.beginPath(); ctx.moveTo(face, 145 - thick / 2); ctx.lineTo(face + length - tip, 145 - thick / 2); ctx.lineTo(face + length, 145 - thick * p.airbrakeTipDiameter / p.airbrakeDiameter / 2); ctx.lineTo(face + length, 145 + thick * p.airbrakeTipDiameter / p.airbrakeDiameter / 2); ctx.lineTo(face + length - tip, 145 + thick / 2); ctx.lineTo(face, 145 + thick / 2); ctx.closePath(); ctx.fill();
    }
    const arrow = (x, y, delta, color) => { if (Math.abs(delta) < 1) return; ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + delta, y); ctx.lineTo(x + delta - Math.sign(delta) * 9, y - 5); ctx.moveTo(x + delta, y); ctx.lineTo(x + delta - Math.sign(delta) * 9, y + 5); ctx.stroke(); };
    arrow(face - 20, 70, Math.sign(f.pistonV) * Math.min(65, Math.abs(f.pistonV) * 12), "#ffbf69");
    arrow(Math.min(bb, 1020), 110, Math.sign(f.bbV) * Math.min(55, Math.abs(f.bbV)), "#5de4e7");
    arrow(475, 216, Math.sign(f.flow) * Math.min(65, Math.abs(f.flow) * 25000), "#5de4e7");
    if (f.insertion > 0 && f.cylinderPressure > f.pressure) { ctx.fillStyle = `rgba(255,191,105,${Math.min(.5, (f.cylinderPressure - f.pressure) / 1e6)})`; ctx.beginPath(); ctx.ellipse(head - 15, 145, 22, 46, 0, 0, Math.PI * 2); ctx.fill(); }
    if (f.bbExited && f.outflow > 0) { ctx.fillStyle = `rgba(93,228,231,${Math.min(.55, f.outflow / Math.max(shot.peakOutflow, 1e-10) * .55)})`; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(end + 15 + i * 14, 145 + (i - 1) * 10, 15, 9 + i * 4, 0, 0, Math.PI * 2); ctx.fill(); } }
    ctx.fillStyle = "#f5faf9"; ctx.beginPath(); ctx.arc(bb, 145, 8, 0, Math.PI * 2); ctx.fill();
    ctx.font = `${Math.max(14, 12 * 1100 / w)}px system-ui`; ctx.fillStyle = "#bcc9ce";
    if (w >= 650) {
      ctx.fillText(t("SPRING / PISTON", "OPRUGA / PISTON"), 40, 35); ctx.fillText(t("HEAD / NOZZLE", "GLAVA / MLAZNICA"), 430, 35); ctx.fillText(t("INNER BARREL", "UNUTARNJA CIJEV"), 720, 35);
      ctx.fillText(`${t("Cylinder", "Cilindar")}: ${fmt((f.cylinderPressure - shot.ambientPressure) / 1e5, 2)} bar(g)`, 40, 248);
      ctx.fillText(`${t("Behind BB", "Iza BB-a")}: ${fmt((f.pressure - shot.ambientPressure) / 1e5, 2)} bar(g)`, 660, 248);
      ctx.fillText(`${t("Overlap", "Preklapanje")}: ${fmt(f.insertion * 1000, 2)} mm · ${t("open area", "otvor")}: ${fmt(f.openArea * 1e6, 3)} mm²`, 200, 280);
    } else {
      ctx.fillText(t("PISTON → HEAD → BB", "PISTON → GLAVA → BB"), 40, 35);
      ctx.fillText(`${t("Pin overlap", "Preklapanje pina")}: ${fmt(f.insertion * 1000, 2)} mm`, 40, 248);
      ctx.fillText(`${t("Open area", "Otvor")}: ${fmt(f.openArea * 1e6, 3)} mm²`, 40, 280);
    }
    ctx.restore();
  }
  function drawCharts(time) {
    const traces = [
      ["pressureChart", [[f => (f.cylinderPressure - shot.ambientPressure) / 1e5, "#ffbf69"], [f => (f.pressure - shot.ambientPressure) / 1e5, "#5de4e7"]]],
      ["pistonChart", [[f => f.pistonV, "#ffbf69"]]], ["bbChart", [[f => f.bbV, "#5de4e7"]]]
    ];
    for (const [id, series] of traces) {
      const { ctx, w, h } = canvasContext(id, 300, 200), left = 44, right = w - 12, top = 18, bottom = h - 28;
      let lo = 0, hi = 0;
      for (const [value] of series) for (const f of shot.frames) { const v = value(f); lo = Math.min(lo, v); hi = Math.max(hi, v); }
      const span = Math.max(.1, hi - lo); lo -= span * .06; hi += span * .08;
      const x = v => left + v / shot.duration * (right - left), y = v => bottom - (v - lo) / (hi - lo) * (bottom - top);
      ctx.font = "12px ui-monospace, monospace"; ctx.textAlign = "right";
      for (let i = 0; i < 4; i++) { const v = lo + (hi - lo) * i / 3, yy = y(v); ctx.strokeStyle = "#28343c"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(left, yy); ctx.lineTo(right, yy); ctx.stroke(); ctx.fillStyle = "#91a0a7"; ctx.fillText(v.toFixed(hi > 20 ? 0 : 1), left - 6, yy + 4); }
      ctx.strokeStyle = "#62757d"; ctx.beginPath(); ctx.moveTo(left, y(0)); ctx.lineTo(right, y(0)); ctx.stroke();
      ctx.save(); ctx.beginPath(); ctx.rect(left, top, right - left, bottom - top); ctx.clip();
      for (const [get, color] of series) { ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.beginPath(); shot.frames.forEach((f, i) => { if (i) ctx.lineTo(x(f.t), y(get(f))); else ctx.moveTo(x(f.t), y(get(f))); }); ctx.stroke(); }
      for (const [key, color] of [["usefulTime", "#6ee7a8"], ["strongBrakeTime", "#ffbf69"], ["exitTime", "#5de4e7"]]) {
        if (shot[key] === null) continue;
        ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.setLineDash(key === "strongBrakeTime" ? [4, 4] : [2, 3]); ctx.beginPath(); ctx.moveTo(x(shot[key]), top); ctx.lineTo(x(shot[key]), bottom); ctx.stroke();
      }
      ctx.setLineDash([]); ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x(time), top); ctx.lineTo(x(time), bottom); ctx.stroke(); ctx.restore();
      ctx.textAlign = "left"; ctx.fillStyle = "#91a0a7"; ctx.fillText("0", left, h - 7); ctx.textAlign = "right"; ctx.fillText(`${(shot.duration * 1000).toFixed(0)} ms`, right, h - 7);
    }
  }
  window.addEventListener("hashchange", () => { if (busy) return; clearTimeout(debounce); if (location.hash === "#pneumatic-timing") recalculate(); render(); });
  window.addEventListener("resize", () => { if (shot?.valid && $("mechanism")) setFrame(fraction); });
  if (location.hash === "#pneumatic-timing") { shot = P.simulate(p); baseline = P.simulate({ ...p, airbrakeLength: 0, airbrakeTaper: 0 }); }
  render();
})();
</script>
